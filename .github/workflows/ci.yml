name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build user-service
        run: cd user-service && ./mvnw clean package -DskipTests -q

      - name: Build account-service
        run: cd account-service && ./mvnw clean package -DskipTests -q

      - name: Build transaction-service
        run: cd transaction-service && ./mvnw clean package -DskipTests -q

      - name: Build notification-service
        run: cd notification-service && ./mvnw clean package -DskipTests -q

      - name: Build api-gateway
        run: cd api-gateway && ./mvnw clean package -DskipTests -q

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push user-service
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/banking-user-service:latest

      - name: Build and push account-service
        uses: docker/build-push-action@v5
        with:
          context: ./account-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/banking-account-service:latest

      - name: Build and push transaction-service
        uses: docker/build-push-action@v5
        with:
          context: ./transaction-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/banking-transaction-service:latest

      - name: Build and push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/banking-notification-service:latest
