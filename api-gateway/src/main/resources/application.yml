server:
  port: 8080

spring:
  application:
    name: api-gateway
  reactor:
    context-propagation: auto
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 1. Route for User Service (Auth & Registration)
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**

            - id: account-service-internal-block
              uri: no://op
              predicates:
                - Path=/api/v1/accounts/*/balance
              filters:
                - SetStatus=403

            # 2. Route for Account Service
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/v1/accounts/**
              filters:
                # Block external PUT requests to the balance endpoint
                - RemoveRequestHeader=Cookie

            # 3. Route for Transaction Service
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/