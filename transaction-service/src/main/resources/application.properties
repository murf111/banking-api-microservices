spring.application.name=transaction-service
server.port=8083

# Fetch secrets from the Central Vault
spring.config.import=optional:configserver:http://localhost:8888

# Register with the Phonebook
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/mydatabase?timezone=UTC
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.hibernate.ddl-auto=update

# Kafka
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# RESILIENCE4J CIRCUIT BREAKER
# How many calls should it monitor before deciding to trip?
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=5
# If 50% of those calls fail, open the circuit!
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
# How long should it wait before trying to close the circuit again?
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
# Allow 2 test calls to see if the account-service is back online
resilience4j.circuitbreaker.instances.accountService.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.accountService.register-health-indicator=true
management.health.circuitbreakers.enabled=true

# Local fallback ? config-server overrides this if it's up
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.endpoints.web.exposure.include=*