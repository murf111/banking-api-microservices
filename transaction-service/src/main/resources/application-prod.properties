# ---------------------------------------------------------------
# Production profile ? activated with: --spring.profiles.active=prod
# ---------------------------------------------------------------

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

eureka.client.serviceUrl.defaultZone=${EUREKA_URL}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL}

# Kafka ? points to MSK or self-hosted broker on AWS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

management.tracing.export.zipkin.endpoint=${ZIPKIN_URL}
management.tracing.sampling.probability=1.0

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized