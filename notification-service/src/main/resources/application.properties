spring.application.name=notification-service
server.port=8084

# Fetch secrets from the Central Vault
spring.config.import=optional:configserver:http://localhost:8888

# Register with Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Tell Kafka it is safe to convert the incoming JSON into our local Java objects
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Tell Kafka to ignore the package name sent by the Transaction Service
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# Tell Kafka exactly which local class to map the JSON to
spring.kafka.consumer.properties.spring.json.value.default.type=com.portfolio.bank.notification.MoneyTransferredEvent