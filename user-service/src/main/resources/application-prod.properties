# ---------------------------------------------------------------
# Production profile ? activated with: --spring.profiles.active=prod
# All secrets injected via environment variables (AWS Secrets Manager,
# ECS task definition, or GitHub Actions secrets).
# ---------------------------------------------------------------

# Database ? points to Amazon RDS instance
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway runs migrations on startup; Hibernate only validates the result
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Eureka ? points to the discovery server on AWS
eureka.client.serviceUrl.defaultZone=${EUREKA_URL}

# Config server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL}

# Tracing ? points to Zipkin on AWS (ECS / EC2)
management.tracing.export.zipkin.endpoint=${ZIPKIN_URL}
management.tracing.sampling.probability=1.0

# Do not expose all actuator endpoints publicly in prod
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized