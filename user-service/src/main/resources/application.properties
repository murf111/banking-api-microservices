spring.application.name=user-service
server.port=8081

# Fetch secrets from the Central Vault
spring.config.import=optional:configserver:http://localhost:8888

# Register with the Phonebook
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Database Configuration (Reusing your monolith DB for now)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/mydatabase?timezone=UTC
spring.datasource.username=myuser
spring.datasource.password=secret
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.tracing.enabled=true
management.endpoints.web.exposure.include=*

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
spring.reactor.context-propagation=auto
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true